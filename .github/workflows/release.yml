name: Release

# Stages a release on npm with trusted publishing (OIDC). No NPM_TOKEN secret.
# The trusted publisher on npmjs.com allows only `npm stage publish`, so nothing goes
# live from CI: a maintainer reviews the staged package and approves it with 2FA
# (`npm stage approve <stage-id>` or the npmjs.com UI).
# Trigger: push a tag `vX.Y.Z` whose version matches package.json.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm >= 11.5.1 and staged publishing >= 11.15.0; Node 22 bundles npm 10.
      - run: npm install -g npm@latest && npm --version
      - run: npm ci
      - name: Check tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match package.json version $version" >&2
            exit 1
          fi
      # Typecheck, tests and build (the same steps prepublishOnly runs), then stage.
      - run: npm run prepublishOnly
      - run: npm stage publish --access public
