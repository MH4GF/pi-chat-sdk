name: Release

# Publishes to npm with trusted publishing (OIDC). No NPM_TOKEN secret.
# Configure once on npmjs.com: package settings > Trusted Publisher > GitHub Actions,
# organization "MH4GF", repository "pi-chat-sdk", workflow filename "release.yml".
# Trigger: push a tag `vX.Y.Z` whose version matches package.json.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm >= 11.5.1; Node 22 bundles npm 10.
      - run: npm install -g npm@latest && npm --version
      - run: npm ci
      - name: Check tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match package.json version $version" >&2
            exit 1
          fi
      # prepublishOnly runs typecheck, tests and build.
      - run: npm publish --access public
