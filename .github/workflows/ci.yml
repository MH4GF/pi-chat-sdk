name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Typecheck every example against the package in this checkout instead of the npm release.
      - run: |
          for dir in examples/*/; do
            echo "== $dir"
            (cd "$dir" \
              && npm pkg set dependencies.pi-chat-sdk=file:../.. \
              && npm install --no-package-lock --no-audit --no-fund \
              && npx tsc --noEmit)
          done
