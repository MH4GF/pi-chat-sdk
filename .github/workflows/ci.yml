name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Verify registry signatures and provenance attestations of everything in the lockfile.
      - run: npm audit signatures
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Typecheck every example against the package in this checkout instead of the npm release.
      - run: |
          for dir in examples/*/; do
            echo "== $dir"
            (cd "$dir" \
              && npm pkg set dependencies.pi-chat-sdk=file:../.. \
              && npm install --no-package-lock --no-audit --no-fund \
              && npx tsc --noEmit)
          done
